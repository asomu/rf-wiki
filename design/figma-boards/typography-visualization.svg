<text x="28" y="32" font-size="20" fill="#162126" font-weight="600" font-family='IBM Plex Sans KR,IBM Plex Sans,Arial,sans-serif' >Typography &amp; Visualization Grammar</text><text x="812" y="31" font-size="10" fill="#5B686E" font-weight="500" font-family='IBM Plex Mono,ui-monospace,monospace' text-anchor='end'>SYSTEM / 03</text><text x="28" y="52" font-size="11" fill="#5B686E" font-weight="400" font-family='IBM Plex Sans KR,IBM Plex Sans,Arial,sans-serif' >문서의 읽기 리듬과 계측 화면의 데이터 문법을 한 장에 고정한다.</text><line x1="28" y1="66" x2="812" y2="66" stroke="#C9D3D5" stroke-width="1"/><rect x="28" y="82" width="370" height="450" rx="8" fill="#FFFFFF" stroke="#C9D3D5" /><text x="46" y="108" font-size="12" fill="#5B686E" font-weight="500" font-family='IBM Plex Sans KR,IBM Plex Sans,Arial,sans-serif' >Typography · 두 family만</text><text x="46" y="151" font-size="29" fill="#162126" font-weight="600" font-family='IBM Plex Sans KR,IBM Plex Sans,Arial,sans-serif' >RBW를 줄이면 왜</text><text x="46" y="187" font-size="29" fill="#162126" font-weight="600" font-family='IBM Plex Sans KR,IBM Plex Sans,Arial,sans-serif' >noise floor가 내려갈까?</text><text x="46" y="222" font-size="15" fill="#162126" font-weight="400" font-family='IBM Plex Sans KR,IBM Plex Sans,Arial,sans-serif' >한글 본문은 17px / 1.75로 읽는다.</text><text x="46" y="249" font-size="15" fill="#162126" font-weight="400" font-family='IBM Plex Sans KR,IBM Plex Sans,Arial,sans-serif' >설정값과 단위는 같은 줄에 둔다.</text><text x="46" y="286" font-size="13" fill="#08746E" font-weight="500" font-family='IBM Plex Mono,ui-monospace,monospace' >CENTER  3.500 000 000 GHz</text><text x="46" y="310" font-size="13" fill="#925E00" font-weight="500" font-family='IBM Plex Mono,ui-monospace,monospace' >RBW       10.000 kHz</text><text x="46" y="334" font-size="13" fill="#3F6F9F" font-weight="500" font-family='IBM Plex Mono,ui-monospace,monospace' >S21       +18.42 dB</text><line x1="46" y1="359" x2="380" y2="359" stroke="#C9D3D5" stroke-width="1"/><text x="46" y="386" font-size="11" fill="#5B686E" font-weight="500" font-family='IBM Plex Sans KR,IBM Plex Sans,Arial,sans-serif' >Display 40/48 · Headline 28/37</text><text x="46" y="409" font-size="11" fill="#5B686E" font-weight="500" font-family='IBM Plex Sans KR,IBM Plex Sans,Arial,sans-serif' >Title 20/29 · Body 17/30</text><text x="46" y="432" font-size="11" fill="#5B686E" font-weight="500" font-family='IBM Plex Sans KR,IBM Plex Sans,Arial,sans-serif' >Label 14/20 · Data 13/20</text><rect x="46" y="464" width="118" height="40" rx="6" fill="#08746E" stroke="#08746E" /><text x="105" y="489" font-size="12" fill="#FFFFFF" font-weight="600" font-family='IBM Plex Sans KR,IBM Plex Sans,Arial,sans-serif' text-anchor='middle'>예측 고정</text><rect x="176" y="464" width="118" height="40" rx="6" fill="#FFFFFF" stroke="#C9D3D5" /><text x="235" y="489" font-size="12" fill="#162126" font-weight="500" font-family='IBM Plex Sans KR,IBM Plex Sans,Arial,sans-serif' text-anchor='middle'>다시 선택</text><rect x="414" y="82" width="398" height="290" rx="10" fill="#10191B" stroke="#10191B" /><text x="434" y="108" font-size="12" fill="#9EB0B3" font-weight="500" font-family='IBM Plex Sans KR,IBM Plex Sans,Arial,sans-serif' >Visualization grammar</text><line x1="448" y1="318" x2="790" y2="318" stroke="#9EB0B3" stroke-width="1"/><line x1="448" y1="134" x2="448" y2="318" stroke="#9EB0B3" stroke-width="1"/><line x1="448" y1="272" x2="790" y2="272" stroke="#C9D3D5" stroke-width="0.6" stroke-dasharray="3 5"/><line x1="448" y1="226" x2="790" y2="226" stroke="#C9D3D5" stroke-width="0.6" stroke-dasharray="3 5"/><line x1="448" y1="180" x2="790" y2="180" stroke="#C9D3D5" stroke-width="0.6" stroke-dasharray="3 5"/><path d="M448 288 C510 286 526 250 570 246 S640 232 676 174 S742 146 790 140" fill="none" stroke="#48C3B8" stroke-width="2.5"/><path d="M448 304 C515 302 552 294 610 292 S705 280 790 278" fill="none" stroke="#7EA9D4" stroke-width="2" stroke-dasharray="7 5"/><line x1="650" y1="134" x2="650" y2="318" stroke="#F0B441"